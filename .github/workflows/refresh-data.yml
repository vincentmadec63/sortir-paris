name: Rafraîchir les données (bi-quotidien)

on:
  schedule:
    # 6h et 16h UTC ~ 7-8h et 17-18h heure de Paris selon la saison.
    - cron: '0 6,16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Lancer les connecteurs de données
        run: npm run refresh-data

      - name: Committer si les données ont changé
        run: |
          git config user.name "sortir-paris-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- public/data/events.json; then
            echo "Aucun changement de données."
          else
            git add public/data/events.json
            git commit -m "chore: rafraîchissement automatique des données"
            git push
          fi
